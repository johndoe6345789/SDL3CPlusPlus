name: Publish Container Image

# The image in .github/workflows/Dockerfile is a build environment (system
# packages plus a warm Conan cache), not a runnable app, so it is published
# only when the recipe it bakes in or the image itself changes. build.yml runs
# inside it, so a stale image costs build time rather than correctness.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - conanfile.py
      - .github/workflows/Dockerfile
      - .github/workflows/publish-container.yml

# An hours-long image build is never worth racing against itself.
concurrency:
  group: publish-container
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            platform: linux
            arch: amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/workflows/Dockerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/${{ github.repository_owner }}/sdl3_app:${{ matrix.platform }}-${{ matrix.arch }}
          build-args: |
            USERNAME=builder
            UID=1000
            GID=1000
