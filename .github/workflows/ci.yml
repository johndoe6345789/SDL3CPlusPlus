name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

# build.yml runs inside the prebaked image published to GHCR.
permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: read
