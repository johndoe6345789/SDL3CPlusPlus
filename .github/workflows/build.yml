name: Build

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  # The image is named after a digest of the recipe it was baked from, so
  # this job answers two questions before a matrix job starts: which image
  # this commit is entitled to, and whether it exists yet. A missing image
  # stops the run here with a sentence about it rather than an opaque
  # `docker pull` failure in `Initialize containers`.
  image:
    name: Resolve build image
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/sdl3_app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute the content tag
        id: tag
        run: |
          set -euo pipefail
          tag="$(bash scripts/image_tag.sh)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Build image content tag: $tag"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require a published image for every architecture
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          missing=()
          # Mirrors the matrix below: one missing architecture should stop
          # the run here, not after the other one has built for an hour.
          for arch in amd64 arm64; do
            ref="${IMAGE}:linux-${arch}-${TAG}"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "Found $ref"
            else
              missing+=("$ref")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            hint="Publish Container Image bakes it from conanfile.py and"
            hint="$hint .github/workflows/Dockerfile, which takes up to an"
            hint="$hint hour the first time. Re-run this build once that"
            hint="$hint workflow has finished."
            echo "::error::No build image for ${missing[*]}. $hint"
            exit 1
          fi

  build:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            platform: linux
            arch: amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    # Everything the build needs - system libraries, Conan, CMake, Ninja and a
    # Conan cache holding the whole dependency tree already compiled - is baked
    # into this image by publish-container.yml, so the job starts at our own
    # sources. The tag carries a digest of the recipe (scripts/image_tag.sh),
    # so this can only ever be the image that matches the checkout - never a
    # leftover from an earlier one.
    container:
      image: >-
        ghcr.io/${{ github.repository_owner }}/sdl3_app:linux-${{
        matrix.arch }}-${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # A job in a container gets `sh` unless asked otherwise, and `set -o
    # pipefail` is not POSIX, so the scripted steps below need real bash.
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: build/${{ matrix.name }}
      ZIP_NAME: sdl3_app-${{ matrix.name }}.zip
      # Where the image keeps its warm cache. Actions rewrites HOME to
      # /github/home inside a container job, so leaving this to the image's
      # own default would send Conan looking in an empty home directory.
      # Stated here as well so an image without the cache fails outright
      # instead of quietly rebuilding the tree from source.
      CONAN_HOME: /opt/conan2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enforce macro policy
        run: bash ./scripts/check_macros.sh

      # The settings have to match the ones the image was baked with, or the
      # package IDs differ and Conan rebuilds the tree from source.
      - name: Install Conan dependencies
        run: |
          conan install . \
            --build=missing \
            -s build_type=Release \
            -c tools.system.package_manager:mode=install \
            -c '&:tools.build:cxxflags=["-include","cstdint"]'

      - name: Configure
        run: |
          set -euo pipefail
          toolchain=$(find "${GITHUB_WORKSPACE}" -type f \
            -name conan_toolchain.cmake -path '*/generators/*' | head -n 1)
          if [ -z "$toolchain" ]; then
            echo "conan_toolchain.cmake was not generated" >&2
            exit 1
          fi
          echo "Using toolchain: $toolchain"
          cmake -S . -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" \
            -DSDL_VERSION=SDL3 \
            -DBUILD_SDL3_APP=ON

      - name: Build
        run: cmake --build "$BUILD_DIR" --config Release

      - name: Test
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure --no-tests=error

      - name: Package release ZIP
        run: python scripts/package_release.py

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sdl3_app-${{ matrix.name }}
          path: release/${{ env.ZIP_NAME }}
          if-no-files-found: error

  # macOS and Windows get no prebaked image: Actions only runs container
  # jobs on Linux. So these builds do on the runner what the Dockerfile does
  # once - compile the dependency tree - and keep the result in an Actions
  # cache instead of a registry. The first run on a new conanfile.py is slow
  # for the same reason the image build is; every run after it is not.
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            generator: Ninja
            cxxflags: '["-include","cstdint"]'
            # apple-clang detects gnu17, which already clears the C++17
            # floor four of these dependencies set, so nothing to add.
            cppstd: ''
          - name: windows-amd64
            runner: windows-2025
            # The Visual Studio generator carries its own compiler
            # environment, so nothing here has to find and source vcvars.
            # It parallelises per project rather than per file, which /MP
            # buys back.
            generator: Visual Studio 17 2022
            cxxflags: '["/FIcstdint","/MP"]'
            # msvc detects cppstd=14, and entt, gtest, assimp and lunasvg
            # all refuse to configure below 17. 20 rather than 17, because
            # that is what python/dev_commands.py has always built this
            # project with on Windows, and because our own code is C++20 -
            # a dependency whose inline code was compiled to a different
            # standard than its consumer is an ODR problem in waiting.
            cppstd: '-s compiler.cppstd=20'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    # Windows runners default to PowerShell; the scripted steps below are
    # the same bash the Linux job runs.
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: build/${{ matrix.name }}
      ZIP_NAME: sdl3_app-${{ matrix.name }}.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Conan plus the same CMake the image pins, so a native build and a
      # containerised one are driven by the same tools. Ninja comes from pip
      # as well rather than from Homebrew: one line, and no runner is asked
      # for a tool it might not have preinstalled.
      - name: Install the build tools
        run: pip install "conan>=2" "cmake==3.31.6" ninja

      # The cache has to live outside the checkout, or the search for
      # conan_toolchain.cmake below could turn up one of Conan's own copies.
      # On Windows it also has to be short and spelled with forward slashes:
      # a source tree unpacked inside it still has to fit MAX_PATH, and
      # RUNNER_TEMP is a backslash path that bash would mangle.
      - name: Choose where the Conan cache lives
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            home="C:/conan2"
          else
            home="$RUNNER_TEMP/conan2"
          fi
          echo "CONAN_HOME=$home" >> "$GITHUB_ENV"
          echo "Conan cache: $home"

      # Restore and save are separate steps so that a run which exhausts its
      # six hours part way through the dependency tree still banks what it
      # compiled. Without that, a tree too big for one job never finishes,
      # however many times it is retried.
      #
      # The save key carries the run id, so every run writes a new entry and
      # the restore keys below pick up the newest. Keying the save on the
      # recipe hash instead looks tidier and silently caps progress at
      # whatever the first run managed: that entry then exists, every later
      # run reports a cache hit, and a guard on that hit skips the save
      # forever.
      - name: Restore the Conan cache
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: >-
            conan-${{ matrix.name }}-${{ hashFiles('conanfile.py')
            }}-${{ github.run_id }}
          restore-keys: |
            conan-${{ matrix.name }}-${{ hashFiles('conanfile.py') }}-
            conan-${{ matrix.name }}-

      - name: Configure Conan
        run: |
          set -euo pipefail
          conan profile detect --force
          # The same fallback the image uses: take sources from the
          # ConanCenter backup mirror when an upstream host is unreachable.
          # Written rather than appended, so a restored cache does not
          # accumulate a copy of this line per run.
          mirror=https://c3i.jfrog.io/artifactory/conan-center-backup-sources/
          echo "core.sources:download_urls=[\"$mirror\", \"origin\"]" \
            > "${CONAN_HOME}/global.conf"

      # Settings are kept to what the graph actually needs, because every
      # one of them that departs from `conan profile detect` moves a
      # package ID away from the binaries ConanCenter publishes and turns a
      # download into a compile. See the matrix for why Windows needs one.
      - name: Install Conan dependencies
        env:
          CPPSTD: ${{ matrix.cppstd }}
        run: |
          conan install . \
            --build=missing \
            -s build_type=Release \
            $CPPSTD \
            -c tools.system.package_manager:mode=install \
            -c '&:tools.build:cxxflags=${{ matrix.cxxflags }}'

      # Sources and build trees are dead weight once the binary exists, and
      # the repository shares a 10 GB cache budget across both runners.
      - name: Trim the Conan cache
        if: always() && steps.conan-cache.outcome == 'success'
        run: conan cache clean

      - name: Save the Conan cache
        if: always() && steps.conan-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: >-
            conan-${{ matrix.name }}-${{ hashFiles('conanfile.py')
            }}-${{ github.run_id }}

      - name: Configure
        run: |
          set -euo pipefail
          toolchain=$(find "$PWD" -type f -name conan_toolchain.cmake \
            -path '*/generators/*' | head -n 1)
          if [ -z "$toolchain" ]; then
            echo "conan_toolchain.cmake was not generated" >&2
            exit 1
          fi
          # CMake is a native Windows program even when bash starts it, so
          # hand it a drive-letter path and not the /d/a/... one find prints.
          if command -v cygpath >/dev/null 2>&1; then
            toolchain=$(cygpath -m "$toolchain")
          fi
          echo "Using toolchain: $toolchain"
          cmake -S . -B "$BUILD_DIR" \
            -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" \
            -DSDL_VERSION=SDL3 \
            -DBUILD_SDL3_APP=ON

      - name: Build
        run: cmake --build "$BUILD_DIR" --config Release --parallel

      # -C names the configuration for the Visual Studio generator, which
      # builds every one of them and so cannot guess which to test.
      - name: Test
        run: |
          ctest --test-dir "$BUILD_DIR" -C Release \
            --output-on-failure --no-tests=error

      - name: Package release ZIP
        run: python scripts/package_release.py

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sdl3_app-${{ matrix.name }}
          path: release/${{ env.ZIP_NAME }}
          if-no-files-found: error
