name: Build

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  # The image is named after a digest of the recipe it was baked from, so
  # this job answers two questions before a matrix job starts: which image
  # this commit is entitled to, and whether it exists yet. A missing image
  # stops the run here with a sentence about it rather than an opaque
  # `docker pull` failure in `Initialize containers`.
  image:
    name: Resolve build image
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/sdl3_app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute the content tag
        id: tag
        run: |
          set -euo pipefail
          tag="$(bash scripts/image_tag.sh)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Build image content tag: $tag"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require a published image for every architecture
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          missing=()
          # Mirrors the matrix below: one missing architecture should stop
          # the run here, not after the other one has built for an hour.
          for arch in amd64 arm64; do
            ref="${IMAGE}:linux-${arch}-${TAG}"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "Found $ref"
            else
              missing+=("$ref")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            hint="Publish Container Image bakes it from conanfile.py and"
            hint="$hint .github/workflows/Dockerfile, which takes up to an"
            hint="$hint hour the first time. Re-run this build once that"
            hint="$hint workflow has finished."
            echo "::error::No build image for ${missing[*]}. $hint"
            exit 1
          fi

  build:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            platform: linux
            arch: amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    # Everything the build needs - system libraries, Conan, CMake, Ninja and a
    # Conan cache holding the whole dependency tree already compiled - is baked
    # into this image by publish-container.yml, so the job starts at our own
    # sources. The tag carries a digest of the recipe (scripts/image_tag.sh),
    # so this can only ever be the image that matches the checkout - never a
    # leftover from an earlier one.
    container:
      image: >-
        ghcr.io/${{ github.repository_owner }}/sdl3_app:linux-${{
        matrix.arch }}-${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # A job in a container gets `sh` unless asked otherwise, and `set -o
    # pipefail` is not POSIX, so the scripted steps below need real bash.
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: build/${{ matrix.name }}
      ZIP_NAME: sdl3_app-${{ matrix.name }}.zip
      # Where the image keeps its warm cache. Actions rewrites HOME to
      # /github/home inside a container job, so leaving this to the image's
      # own default would send Conan looking in an empty home directory.
      # Stated here as well so an image without the cache fails outright
      # instead of quietly rebuilding the tree from source.
      CONAN_HOME: /opt/conan2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enforce macro policy
        run: bash ./scripts/check_macros.sh

      # The settings have to match the ones the image was baked with, or the
      # package IDs differ and Conan rebuilds the tree from source.
      - name: Install Conan dependencies
        run: |
          conan install . \
            --build=missing \
            -s build_type=Release \
            -c tools.system.package_manager:mode=install \
            -c '&:tools.build:cxxflags=["-include","cstdint"]'

      - name: Configure
        run: |
          set -euo pipefail
          toolchain=$(find "${GITHUB_WORKSPACE}" -type f \
            -name conan_toolchain.cmake -path '*/generators/*' | head -n 1)
          if [ -z "$toolchain" ]; then
            echo "conan_toolchain.cmake was not generated" >&2
            exit 1
          fi
          echo "Using toolchain: $toolchain"
          cmake -S . -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" \
            -DSDL_VERSION=SDL3 \
            -DBUILD_SDL3_APP=ON

      - name: Build
        run: cmake --build "$BUILD_DIR" --config Release

      - name: Test
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure --no-tests=error

      - name: Package release ZIP
        run: python scripts/package_release.py

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sdl3_app-${{ matrix.name }}
          path: release/${{ env.ZIP_NAME }}
          if-no-files-found: error

  # macOS and Windows get no prebaked image: Actions only runs container
  # jobs on Linux. So these builds do on the runner what the Dockerfile does
  # once - compile the dependency tree - and keep the result in an Actions
  # cache instead of a registry. The first run on a new conanfile.py is slow
  # for the same reason the image build is; every run after it is not.
  #
  # Each entry builds one architecture per pass, so macOS can ask for two
  # and lipo them into a single universal binary at the end.
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            runner: windows-2025
            arches: x86_64
            native_arch: x86_64
            # No -G at all: CMake defaults to the newest Visual Studio on
            # the machine, which is the one Conan detected and built the
            # dependencies with. Naming a generator here is how this job
            # broke twice - the label now resolves to a VS 2026 image, and
            # anything hardcoded is a guess about which image sits behind a
            # label GitHub moves. A Visual Studio generator also brings its
            # own compiler environment, so nothing has to source vcvars; it
            # parallelises per project rather than per file, which /MP buys
            # back.
            generator: ''
            cxxflags: '["/FIcstdint","/MP"]'
            # msvc detects cppstd=14, and entt, gtest, assimp and lunasvg
            # all refuse to configure below 17. 20 rather than the 17 that
            # would just clear the bar, because 20 is what
            # python/dev_commands.py has always built this project with on
            # Windows, and because our own code is C++20 - a dependency
            # whose inline code was compiled to a different standard than
            # its consumer is an ODR problem in waiting.
            settings: '-s compiler.cppstd=20'
          - name: windows-arm64
            runner: windows-11-arm
            arches: armv8
            native_arch: armv8
            generator: ''
            cxxflags: '["/FIcstdint","/MP"]'
            settings: '-s compiler.cppstd=20'
          - name: macos-universal
            runner: macos-15
            # Two slices, joined by lipo at the end. Conan turns -s arch
            # into CMAKE_OSX_ARCHITECTURES, so each pass produces a
            # single-architecture binary that knows nothing of the other.
            # The runner is arm64, which makes the x86_64 pass a cross
            # build - and is why only one of the two can be tested.
            arches: armv8 x86_64
            native_arch: armv8
            generator: -G Ninja
            cxxflags: '["-include","cstdint"]'
            settings: ''
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    # Windows runners default to PowerShell; the scripted steps below are
    # the same bash the Linux job runs.
    defaults:
      run:
        shell: bash
    env:
      # One directory per architecture under SLICE_ROOT, and the tree the
      # ZIP is built from in BUILD_DIR. They are separate because a
      # universal build has two of the former and one of the latter.
      SLICE_ROOT: build/${{ matrix.name }}
      BUILD_DIR: build/${{ matrix.name }}/release
      ZIP_NAME: sdl3_app-${{ matrix.name }}.zip
      ARCHES: ${{ matrix.arches }}
      NATIVE_ARCH: ${{ matrix.native_arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # CMake is deliberately the runner's own. The image pins 3.31.6
      # because ConanCenter publishes no Linux ARM binaries and cmake.org
      # answers 403 - neither is true here, and pinning it cost a run: a
      # CMake older than the Visual Studio on the same machine cannot
      # generate for it. Ninja comes from pip so no runner is asked for a
      # tool it might not have preinstalled.
      - name: Install the build tools
        run: pip install "conan>=2" ninja

      # The cache has to live outside the checkout, or the search for
      # conan_toolchain.cmake below could turn up one of Conan's own copies.
      # On Windows it also has to be short and spelled with forward slashes:
      # a source tree unpacked inside it still has to fit MAX_PATH, and
      # RUNNER_TEMP is a backslash path that bash would mangle.
      - name: Choose where the Conan cache lives
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            home="C:/conan2"
          else
            home="$RUNNER_TEMP/conan2"
          fi
          echo "CONAN_HOME=$home" >> "$GITHUB_ENV"
          echo "Conan cache: $home"

      # Restore and save are separate steps so that a run which exhausts its
      # six hours part way through the dependency tree still banks what it
      # compiled. Without that, a tree too big for one job never finishes,
      # however many times it is retried.
      #
      # The save key carries the run id, so every run writes a new entry and
      # the restore keys below pick up the newest. Keying the save on the
      # recipe hash instead looks tidier and silently caps progress at
      # whatever the first run managed: that entry then exists, every later
      # run reports a cache hit, and a guard on that hit skips the save
      # forever.
      - name: Restore the Conan cache
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: >-
            conan-${{ matrix.name }}-${{ hashFiles('conanfile.py')
            }}-${{ github.run_id }}
          restore-keys: |
            conan-${{ matrix.name }}-${{ hashFiles('conanfile.py') }}-
            conan-${{ matrix.name }}-

      - name: Configure Conan
        run: |
          set -euo pipefail
          conan profile detect --force
          # The same fallback the image uses: take sources from the
          # ConanCenter backup mirror when an upstream host is unreachable.
          # Written rather than appended, so a restored cache does not
          # accumulate a copy of this line per run.
          mirror=https://c3i.jfrog.io/artifactory/conan-center-backup-sources/
          echo "core.sources:download_urls=[\"$mirror\", \"origin\"]" \
            > "${CONAN_HOME}/global.conf"

      # Settings are kept to what the graph actually needs, because every
      # one that departs from `conan profile detect` moves a package ID away
      # from the binaries ConanCenter publishes and turns a download into a
      # compile. See the matrix for why Windows needs one.
      - name: Install Conan dependencies
        env:
          EXTRA_SETTINGS: ${{ matrix.settings }}
        run: |
          set -euo pipefail
          for arch in $ARCHES; do
            echo "::group::conan install $arch"
            conan install . \
              --output-folder "$SLICE_ROOT/$arch" \
              --build=missing \
              -s build_type=Release \
              -s arch="$arch" \
              ${EXTRA_SETTINGS:-} \
              -c tools.system.package_manager:mode=install \
              -c '&:tools.build:cxxflags=${{ matrix.cxxflags }}'
            echo "::endgroup::"
          done

      # Sources and build trees are dead weight once the binary exists, and
      # the repository shares a 10 GB cache budget across the runners.
      - name: Trim the Conan cache
        if: always() && steps.conan-cache.outcome == 'success'
        run: conan cache clean

      - name: Save the Conan cache
        if: always() && steps.conan-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: >-
            conan-${{ matrix.name }}-${{ hashFiles('conanfile.py')
            }}-${{ github.run_id }}

      - name: Configure and build each architecture
        env:
          GENERATOR: ${{ matrix.generator }}
        run: |
          set -euo pipefail
          for arch in $ARCHES; do
            toolchain=$(find "$PWD/$SLICE_ROOT/$arch" -type f \
              -name conan_toolchain.cmake -path '*/generators/*' | head -n 1)
            if [ -z "$toolchain" ]; then
              echo "conan_toolchain.cmake was not generated for $arch" >&2
              exit 1
            fi
            # CMake is a native Windows program even when bash starts it,
            # so hand it a drive-letter path, not the /d/a/... find prints.
            if command -v cygpath >/dev/null 2>&1; then
              toolchain=$(cygpath -m "$toolchain")
            fi
            echo "::group::build $arch"
            echo "Using toolchain: $toolchain"
            cmake -S . -B "$SLICE_ROOT/$arch/app" \
              ${GENERATOR:-} \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$toolchain" \
              -DSDL_VERSION=SDL3 \
              -DBUILD_SDL3_APP=ON
            cmake --build "$SLICE_ROOT/$arch/app" --config Release --parallel
            echo "::endgroup::"
          done

      # Only the slice matching the runner can execute: on the universal
      # build the x86_64 half is cross-compiled and has nothing here to run
      # it. -C names the configuration for the Visual Studio generator,
      # which builds every one of them and so cannot guess which to test.
      - name: Test
        run: |
          ctest --test-dir "$SLICE_ROOT/$NATIVE_ARCH/app" -C Release \
            --output-on-failure --no-tests=error

      # package_release.py wants one directory holding the binary beside the
      # packages/ tree, which is what this assembles - joining the slices
      # with lipo when the matrix asked for more than one.
      - name: Assemble the release tree
        run: |
          set -euo pipefail
          find_binary() {
            for candidate in "$1/sdl3_app" "$1/sdl3_app.exe" \
                "$1/Release/sdl3_app" "$1/Release/sdl3_app.exe"; do
              if [ -f "$candidate" ]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            echo "no sdl3_app built under $1" >&2
            return 1
          }
          mkdir -p "$BUILD_DIR"
          cp -R "$SLICE_ROOT/$NATIVE_ARCH/app/packages" "$BUILD_DIR/packages"
          slices=()
          for arch in $ARCHES; do
            slices+=("$(find_binary "$SLICE_ROOT/$arch/app")")
          done
          binary="$BUILD_DIR/$(basename "${slices[0]}")"
          if [ "${#slices[@]}" -gt 1 ]; then
            lipo -create "${slices[@]}" -output "$binary"
            lipo -info "$binary"
          else
            cp "${slices[0]}" "$binary"
          fi

      - name: Package release ZIP
        run: python scripts/package_release.py

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sdl3_app-${{ matrix.name }}
          path: release/${{ env.ZIP_NAME }}
          if-no-files-found: error
