name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Releases are cut in commit order, so never cancel one part way through.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    # build.yml runs inside the prebaked image published to GHCR.
    permissions:
      contents: read
      packages: read

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release ZIPs
        uses: actions/download-artifact@v4
        with:
          pattern: sdl3_app-*
          path: release
          merge-multiple: true

      - name: Describe the release
        id: describe
        run: |
          set -euo pipefail
          tag="v0.1.${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "subject<<EOF_SUBJECT"
            git log -1 --pretty=%s
            echo "EOF_SUBJECT"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.describe.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.describe.outputs.tag }} — ${{ steps.describe.outputs.subject }}
          body: |
            Automated build of [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            > ${{ steps.describe.outputs.subject }}

            One ZIP per platform - `linux-amd64`, `linux-arm64`,
            `windows-amd64`, `windows-arm64`, and `macos-universal`, which
            is a fat binary carrying both Apple silicon and Intel. Unzip the
            one for your machine, then start the point-and-click launcher:
            it lists the bundled game packages and runs `sdl3_app` for the
            one you pick.

            ```sh
            bash run_gui.sh
            ```

            It needs Python 3 and PyQt6; when PyQt6 is missing the script
            installs it into a `.venv-gui` beside itself.

            ZIP archives do not carry the executable bit, so on Linux and
            macOS mark the binary runnable first:

            ```sh
            chmod +x sdl3_app run_gui.sh
            ```

            These builds are unsigned, and macOS quarantines what a browser
            downloaded, so clear that too:

            ```sh
            xattr -dr com.apple.quarantine .
            ```
          files: release/*.zip
          fail_on_unmatched_files: true
